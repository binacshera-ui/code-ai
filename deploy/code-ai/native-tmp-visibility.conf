# The managed native owner publishes daemon socket aliases into its private
# /tmp/codex-daemon-UID directory. Preserve the API's PrivateTmp isolation but
# expose this one same-UID dependency. Install only after validating ownership
# and that all referenced owners use this host directory (not another mount).
[Service]
PrivateTmp=yes
BindReadOnlyPaths=/tmp/codex-daemon-%U
